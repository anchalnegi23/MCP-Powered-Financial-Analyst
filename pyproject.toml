[project]
name = "financial-analyst-mcp"
version = "0.1.0"
description = "MCP-powered financial analyst: FastMCP servers + LangGraph agent + FastAPI + Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # MCP
    "fastmcp>=2.10",
    "mcp>=1.9",
    # Agent
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    # API / UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    # Data / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    # Persistence / cache / RAG
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "redis>=5.2",
    "chromadb>=0.5.20",
    # Misc
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
calculator-mcp = "servers.calculator_mcp.server:main"
market-mcp = "servers.market_mcp.server:main"
financial-mcp = "servers.financial_mcp.server:main"
news-mcp = "servers.news_mcp.server:main"
research-mcp = "servers.research_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "models", "servers", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not integration'"
markers = [
    "integration: hits live external APIs; deselected by default (-m 'not integration')",
]

[tool.coverage.run]
source = ["agent", "api", "models", "servers", "services"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# The target is 80%; the suite currently sits above 90%. Failing under 80 keeps a
# future change from quietly removing coverage.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# ASYNC109: explicit timeout args are correct here. These wrap *blocking* provider calls
# in worker threads, where asyncio.timeout cannot cancel the underlying work anyway.
"services/providers/*.py" = ["ASYNC109"]
# ASYNC240: tests load fixture files synchronously inside async tests. The rule targets
# blocking I/O in an event loop serving requests, which a test fixture load is not.
# ASYNC110: the UI end-to-end harness bridges a threading.Event into an asyncio loop,
# which is what this poll is for; asyncio.Event cannot be set from the pytest thread.
"tests/*.py" = ["ASYNC240", "ASYNC110"]
